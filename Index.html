<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control ESP8266 - Alhama de Murcia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
    <!-- Librería Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :raíz {
            --bg: #0f172a;
            --tarjeta: #1e293b;
            --primario: #3b82f6;
            --éxito: #10b981;
            --advertencia: #f59e0b;
            --peligro: #ef4444;
            --texto: #f8fafc;
            --silenciado: #94a3b8;
            --borde: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        cuerpo {
            color de fondo: var(--bg);
            color: var(--text);
            pantalla: flexible;
            justificar-contenido: centro;
            alinear-elementos: centro;
            altura mínima: 100vh;
            relleno: 20px;
        }

        .contenedor {
            ancho: 100%;
            ancho máximo: 420px;
            fondo: var(--card);
            radio de borde: 16px;
            relleno: 24px;
            borde: 1px var sólido (--borde);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 1.4rem; color: var(--text); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .header p { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

        .status-box {
            fondo: rgba(15, 23, 42, 0.6);
            borde: 1px var sólido (--borde);
            radio de borde: 12px;
            relleno: 14px;
            pantalla: flexible;
            alinear-elementos: centro;
            justificar-contenido: espacio-entre;
            margen inferior: 20px;
        }

        .status-info { display: flex; align-items: center; gap: 10px; }
        .status-dot { ancho: 12px; alto: 12px; radio de borde: 50%; fondo: var(--muted); transición: all 0.3s ease; }
        .status-dot.active { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .status-dot.inactive { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

        .section-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

        .mode-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        .btn-mode {
            fondo: #0f172a;
            borde: 1px var sólido (--borde);
            color: var(--muted);
            relleno: 12px 6px;
            radio de borde: 10px;
            tamaño de fuente: 0,85rem;
            grosor de fuente: 600;
            cursor: puntero;
            pantalla: flexible;
            flex-direction: columna;
            alinear-elementos: centro;
            espacio: 6px;
            transición: todos 0,2 s de facilidad;
        }

        .btn-mode.active-on { background: rgba(16, 185, 129, 0.15); border-color: var(--success); color: var(--success); }
        .btn-mode.active-off { fondo: rgba(239, 68, 68, 0.15); color del borde: var(--peligro); color: var(--peligro); }
        .btn-mode.active-auto { background: rgba(59, 130, 246, 0.15); border-color: var(--primary); color: var(--primary); }

        .auto-settings {
            fondo: rgba(15, 23, 42, 0.4);
            borde: 1px var sólido (--borde);
            radio de borde: 12px;
            relleno: 16px;
            margen inferior: 20px;
            mostrar: ninguno;
        }

        .auto-settings.visible { display: block; }

        .toggle-solar {
            pantalla: flexible;
            alinear-elementos: centro;
            justificar-contenido: espacio-entre;
            fondo: var(--card);
            relleno: 10px;
            radio de borde: 8px;
            margen inferior: 12px;
            borde: 1px var sólido (--borde);
            tamaño de fuente: 0,85rem;
        }

        .switch { position: relative; width: 40px; height: 22px; }
        .switch input { opacidad: 0; ancho: 0; alto: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #334155; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background: var(--warning); }
        input:checked + .slider:before { transform: translateX(18px); }

        .time-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-box { display: flex; flex-direction: column; gap: 4px; }
        .input-box label { font-size: 0.75rem; color: var(--muted); }
        .input-box input[type="time"] {
            fondo: #0f172a;
            borde: 1px var sólido (--borde);
            color: var(--text);
            relleno: 8px;
            radio de borde: 6px;
            tamaño de fuente: 0,9rem;
            esquema: ninguno;
            ancho: 100%;
        }

        .input-box input[type="time"]:disabled {
            opacidad: 0,6;
            cursor: no permitido;
        }

        .btn-guardar {
            ancho: 100%;
            fondo: var(--primary);
            color: blanco;
            borde: ninguno;
            relleno: 10px;
            radio de borde: 8px;
            grosor de fuente: 600;
            cursor: puntero;
            margen superior: 12px;
            transición: fondo 0,2 s;
        }

        .btn-save:hover { background: #2563eb; }
    </style>
</head>
<cuerpo>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-bolt" style="color: var(--warning);"></i> ESP8266</h1>
        <p>Alhama de Murcia</p>
    </div>

    <div class="status-box">
        <div class="status-info">
            <div id="statusDot" class="status-dot"></div>
            <div>
                <h2 id="statusText" style="font-size: 0.95rem;">APAGADO</h2>
                <span id="modeLabel" style="font-size: 0.75rem; color: var(--muted);">Modo: DESACTIVADO</span>
            </div>
        </div>
        <i id="statusIcon" class="fa-solid fa-power-off" style="font-size: 1.3rem; color: var(--danger);"></i>
    </div>

    <div class="section-title">Modo</div>
    <div class="mode-buttons">
        <button id="btnOn" class="btn-mode" onclick="setMode('ON')"><i class="fa-solid fa-power-off"></i>ON</button>
        <button id="btnOff" class="btn-mode active-off" onclick="setMode('OFF')"><i class="fa-solid fa-toggle-off"></i>OFF</button>
        <button id="btnAuto" class="btn-mode" onclick="setMode('AUTO')"><i class="fa-solid fa-clock"></i>AUTO</button>
    </div>

    <div id="autoSettings" class="auto-settings">
        <div class="section-title">Ajusta AUTOMÁTICAMENTE</div>
       
        <div class="toggle-solar">
            <label><i class="fa-solid fa-sun" style="color: var(--warning);"></i> Sol (Salida/Puesta)</label>
            <label class="switch">
                <input type="checkbox" id="solarSwitch" onchange="toggleSolarMode()">
                <span class="slider"></span>
            </label>
        </div>

        <div id="customSchedule">
            <div class="time-inputs">
                <div class="input-box">
                    <label>Encendido</label>
                    <input type="time" id="h_on" value="08:00">
                </div>
                <div class="input-box">
                    <label>Apagado</label>
                    <input type="time" id="h_off" value="20:00">
                </div>
            </div>
            <button id="btnSaveSchedule" class="btn-save" onclick="saveSchedule()">Guardar Horario</button>
        </div>
    </div>
</div>

<script>
    // Configuración con tus claves integradas directamente
    const firebaseConfig = {
        apiKey: "AIzaSyAuXCEZGd0d39eR3PJLUeGIV9YbeyXC2Ss",
        URL de la base de datos: "https://luces-campo-default-rtdb.firebaseio.com"
    };

    let db = null;

    // Coordenadas exactas para Alhama de Murcia
    constante LATITUD = 37.8508;
    constante LONGITUD = -1.4251;

    función initFirebase() {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        escucharEstado();
    }

    función listenToState() {
        si (!db) regresar;
        db.ref('relai_state').on('value', snap => updateUIState(snap.val()));
        db.ref('mode').on('value', snap => updateModeUI(snap.val() || 'OFF'));
        db.ref('solar_mode').on('value', snap => {
            const isSolar = snap.val() || false;
            document.getElementById('solarSwitch').checked = isSolar;
            alternarSolarUI(isSolar);
        });
        db.ref('schedules').on('value', snap => {
            const datos = snap.val();
            if (data && !document.getElementById('solarSwitch').checked) {
                if (data.h_on) document.getElementById('h_on').value = data.h_on;
                Si (data.h_off) document.getElementById('h_off').value = data.h_off;
            }
        });
    }

    función asíncrona fetchSolarTimes() {
        intentar {
            const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LATITUD}&longitude=${LONGITUD}&daily=sunrise,sunset&timezone=auto`);
            const datos = esperar respuesta.json();
           
            const amanecer = data.daily.sunrise[0].split('T')[1].substring(0, 5);
            const puesta de sol = data.daily.sunset[0].split('T')[1].substring(0, 5);

            document.getElementById('h_on').value = amanecer;
            document.getElementById('h_off').value = puesta de sol;

            si (db) {
                db.ref('schedules').set({ h_on: amanecer, h_off: atardecer });
            }
        } catch (error) {
            console.error("Error al consultar el sol:", error);
        }
    }

    función actualizarUIState(isOn) {
        const dot = document.getElementById('statusDot');
        const texto = document.getElementById('statusText');
        const icon = document.getElementById('statusIcon');
        si (isOn === verdadero || isOn === 'ON') {
            dot.className = "status-dot activo";
            texto.textointerior = "ENCENDIDO";
            icono.estilo.color = "var(--éxito)";
        } demás {
            dot.className = "status-dot inactivo";
            texto.innerText = "APAGADO";
            icono.estilo.color = "var(--peligro)";
        }
    }

    función setMode(modo) {
        actualizarModoUI(modo);
        if (mode === 'ON') updateUIState(true);
        if (mode === 'OFF') updateUIState(false);
        if (db) db.ref('mode').set(mode);
    }

    función updateModeUI(modo) {
        document.getElementById('btnOn').className = "btn-mode " + (mode === 'ON' ? 'active-on' : '');
        document.getElementById('btnOff').className = "btn-mode " + (mode === 'OFF' ? 'active-off' : '');
        document.getElementById('btnAuto').className = "btn-mode " + (mode === 'AUTO' ? 'active-auto' : '');
        document.getElementById('modeLabel').innerText = "Modo: " + modo;
       
        const autoSettings = document.getElementById('autoSettings');
        if (mode === 'AUTO') autoSettings.classList.add('visible');
        de lo contrario autoSettings.classList.remove('visible');
    }

    función alternarModoSolar() {
        const isSolar = document.getElementById('solarSwitch').checked;
        if (db) db.ref('solar_mode').set(isSolar);
        alternarSolarUI(isSolar);
    }

    función alternarSolarUI(isSolar) {
        const hOnInput = document.getElementById('h_on');
        const hOffInput = document.getElementById('h_off');
        const saveBtn = document.getElementById('btnSaveSchedule');

        si (esSolar) {
            hOnInput.disabled = true;
            hOffInput.disabled = true;
            saveBtn.style.display = 'none';
            obtenerHorasSolares();
        } demás {
            hOnInput.disabled = false;
            hOffInput.disabled = false;
            saveBtn.style.display = 'bloquear';
        }
    }

    función saveSchedule() {
        si (db) {
            db.ref('schedules').set({
                h_on: document.getElementById('h_on').value,
                h_off: document.getElementById('h_off').value
            }).then(() => alert("Horario guardado"));
        }
    }

    window.onload = () => {
        initFirebase();
    };
</script>
</body>
</html>
